name: CI

on:
  push:
  pull_request:

env:
  IMAGE_NAME: ghcr.io/agenzia-tpl/rpsd-ingest

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out rpsd-ingest
        uses: actions/checkout@v4
        with:
          path: rpsd-ingest

      # rpsd-commons is a build-time dependency (additional_contexts in Dockerfile)
      # and a runtime dependency (local path in pyproject.toml uv.sources).
      # GH_REPO_TOKEN must be a PAT or fine-grained token with read access to rpsd-commons.
      - name: Check out rpsd-commons
        uses: actions/checkout@v4
        with:
          repository: Agenzia-TPL/rpsd-commons
          token: ${{ secrets.GH_REPO_TOKEN }}
          path: rpsd-commons
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        working-directory: rpsd-ingest
        run: uv sync --dev

      - name: Lint
        working-directory: rpsd-ingest
        run: uv run ruff check .

      - name: Test
        working-directory: rpsd-ingest
        # Exit code 5 = no tests collected — acceptable while the test suite is being built.
        # The || pattern is used instead of capturing $? because GitHub Actions runs bash
        # with -e (exit on error), which would cause the shell to exit before $? is read.
        run: uv run pytest -m "not integration" || [ $? -eq 5 ]

  build-and-push:
    name: Build & Push
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out rpsd-ingest
        uses: actions/checkout@v4
        with:
          path: rpsd-ingest

      - name: Check out rpsd-commons
        uses: actions/checkout@v4
        with:
          repository: Agenzia-TPL/rpsd-commons
          token: ${{ secrets.GH_REPO_TOKEN }}
          path: rpsd-commons
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./rpsd-ingest
          build-contexts: |
            rpsd-commons=./rpsd-commons
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
